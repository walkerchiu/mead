# docker-compose.selfhost.yml — 自架部署 overlay：Caddy 反向代理（自動 HTTPS）+ 容器化 app。
# 與基礎設施 docker-compose.yml 疊加、並帶 --profile app（backend / frontend 定義在 base，profile app）：
#
#   docker compose -f docker-compose.yml -f docker-compose.selfhost.yml --profile app up -d --build
#
# 注意：本檔是「自架 HTTPS 部署」用途，與資源限額 override（docker-compose.<env>.override.yml）**不同**，
#       兩者命名刻意區分以免混淆；需要時可再疊資源限額：再加 -f docker-compose.prod.override.yml。
# 前置：建立 .env（含 SITE_DOMAIN、ACME_EMAIL）、
#       apps/frontend/.env.prod、apps/backend/.env.prod

services:
  # 反向代理 + 自動申請/續簽 Let's Encrypt 憑證
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?請於 .env 設定 SITE_DOMAIN（如 portal.example.gov.tw）}
      ACME_EMAIL: ${ACME_EMAIL:?請於 .env 設定 ACME_EMAIL（憑證通知信箱）}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # 憑證與 ACME 帳號 — 務必持久保留，勿刪
      - caddy-config:/config
    depends_on:
      - frontend
      - backend

  # 前端入口網（Next.js standalone）— 服務本體定義在 base（profile app），此處疊加自架部署設定。
  frontend:
    profiles: ['app']
    env_file:
      - apps/frontend/.env.prod
    expose:
      - '3000' # 僅供內網（Caddy）存取，不對外開埠

  # 後端（NestJS GraphQL）— 服務本體定義在 base（profile app），此處疊加自架部署設定。
  backend:
    profiles: ['app']
    env_file:
      - apps/backend/.env.prod
    expose:
      - '4000'
    depends_on:
      - timescaledb
      - rabbitmq
      - dragonfly

volumes:
  caddy-data:
  caddy-config:
