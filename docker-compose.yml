services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: wind-timescaledb
    restart: unless-stopped
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:-wind_db}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: wind-rabbitmq
    restart: unless-stopped
    ports:
      - '127.0.0.1:${RABBITMQ_PORT:-5672}:5672' # AMQP 協定（僅限本機存取）
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672' # 管理介面（僅限本機存取）
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set in .env.docker}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
      # ✅ 增加最大消息大小限制到 512MB（從默認 128MB）
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbit max_message_size 536870912'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.14.5
    container_name: wind-dragonfly
    restart: unless-stopped
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - dragonfly-data:/data
    ulimits:
      memlock: -1
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: wind-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAIL_SMTP_PORT:-1025}:1025' # SMTP 端口
      - '127.0.0.1:${MAIL_WEB_PORT:-8025}:8025' # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '--spider', 'http://localhost:8025/api/v1/info']
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  timescaledb-data:
  rabbitmq-data:
  dragonfly-data:
