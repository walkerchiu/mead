# docker-compose.yml — MEAD 唯一 compose 基底（tracked IaC，無機密：密碼走 ${VAR} 從 .env.docker 插值）。
# 用 profile 閘控分層：
#   - 無 profile（always-on）：核心 infra timescaledb / rabbitmq / dragonfly。
#   - profile `tools`：mailpit / adminer（dev 工具，prod 不啟）。
#   - profile `storage`：SeaweedFS 四件套。
# 後端 / 前端目前跑在 host（cli.sh dev / pnpm dev），未納入 compose；無 app profile。
# 本檔不含任何資源限額（cpus / mem_limit）。

name: mead

services:
  # 核心 infra（必須，無 profile，always-on）

  timescaledb:
    image: timescale/timescaledb:2.27.0-pg16 # 釘版（原 latest-pg16）
    container_name: mead-timescaledb
    restart: unless-stopped
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:-mead_db}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mead-rabbitmq
    restart: unless-stopped
    ports:
      - '127.0.0.1:${RABBITMQ_PORT:-5672}:5672' # AMQP 協定（僅限本機存取）
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672' # 管理介面（僅限本機存取）
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-hq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set in .env.docker}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
      # ✅ 增加最大消息大小限制到 512MB（從默認 128MB）
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbit max_message_size 536870912'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.14.5
    container_name: mead-dragonfly
    restart: unless-stopped
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - dragonfly-data:/data
    ulimits:
      memlock: -1
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # dev 工具（profile `tools`）—— 不帶 --profile tools / 不顯式命名則不啟（prod 不要）。
  # ==========================================

  mailpit:
    image: axllent/mailpit:v1.29.0 # 釘版（原 latest）
    container_name: mead-mailpit
    restart: unless-stopped
    profiles: ['tools'] # dev 工具：不帶 --profile tools / 不顯式命名則不啟（prod 不要）
    ports:
      - '127.0.0.1:${MAIL_SMTP_PORT:-1025}:1025' # SMTP 端口
      - '127.0.0.1:${MAIL_WEB_PORT:-8025}:8025' # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '--spider', 'http://localhost:8025/api/v1/info']
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================
  # Adminer - 輕量資料庫 Web GUI
  # ==========================================
  adminer:
    image: adminer:5
    container_name: mead-adminer
    restart: unless-stopped
    profiles: ['tools'] # dev 工具：不帶 --profile tools / 不顯式命名則不啟（prod 不要）
    ports:
      - '127.0.0.1:${ADMINER_PORT:-5556}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: timescaledb
      ADMINER_DEFAULT_DRIVER: pgsql
      ADMINER_DEFAULT_DB: ${POSTGRES_DB:-mead_db}
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:8080/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================
  # SeaweedFS 服務（可選，使用 --profile storage）
  # ==========================================

  # SeaweedFS Master - 管理元資料和卷分配
  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: mead-seaweedfs-master
    restart: unless-stopped
    profiles: ['storage']
    ports:
      - '127.0.0.1:${SEAWEEDFS_MASTER_PORT:-9333}:9333' # Master HTTP API
      - '127.0.0.1:${SEAWEEDFS_MASTER_GRPC_PORT:-19333}:19333' # Master gRPC
    command: 'master -ip=seaweedfs-master -ip.bind=0.0.0.0'
    volumes:
      - seaweedfs-master-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '--spider',
          'http://localhost:9333/cluster/status',
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  # SeaweedFS Volume Server - 儲存實際檔案
  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    container_name: mead-seaweedfs-volume
    restart: unless-stopped
    profiles: ['storage']
    ports:
      - '127.0.0.1:${SEAWEEDFS_VOLUME_PORT:-8080}:8080' # Volume HTTP API
      - '127.0.0.1:${SEAWEEDFS_VOLUME_GRPC_PORT:-18080}:18080' # Volume gRPC
    command: 'volume -mserver=seaweedfs-master:9333 -ip.bind=0.0.0.0 -port=8080'
    volumes:
      - seaweedfs-volume-data:/data
    depends_on:
      - seaweedfs-master
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8080/status']
      interval: 10s
      timeout: 5s
      retries: 3

  # SeaweedFS Filer - 提供檔案系統介面
  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: mead-seaweedfs-filer
    restart: unless-stopped
    profiles: ['storage']
    ports:
      - '127.0.0.1:${SEAWEEDFS_FILER_PORT:-8888}:8888' # Filer HTTP API
      - '127.0.0.1:${SEAWEEDFS_FILER_GRPC_PORT:-18888}:18888' # Filer gRPC
    command: 'filer -master=seaweedfs-master:9333 -ip.bind=0.0.0.0'
    volumes:
      - seaweedfs-filer-data:/data
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8888/']
      interval: 10s
      timeout: 5s
      retries: 3

  # SeaweedFS S3 Gateway - S3 兼容 API
  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    container_name: mead-seaweedfs-s3
    restart: unless-stopped
    profiles: ['storage']
    ports:
      - '127.0.0.1:${SEAWEEDFS_S3_PORT:-8333}:8333' # S3 API
    command: 's3 -filer=seaweedfs-filer:8888 -ip.bind=0.0.0.0 -config=/etc/seaweedfs/s3.json'
    volumes:
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    depends_on:
      - seaweedfs-filer
    environment:
      - WEED_S3_DEFAULT_USER=${SEAWEEDFS_S3_USER:-admin}
      - WEED_S3_DEFAULT_PWD=${SEAWEEDFS_S3_PASSWORD:-admin123}
    # 注意：S3 API 所有端點都需要認證，無法使用簡單的 HTTP 健康檢查
    # 服務能綁定端口即代表正常運行

volumes:
  timescaledb-data:
  rabbitmq-data:
  dragonfly-data:
  seaweedfs-master-data:
  seaweedfs-volume-data:
  seaweedfs-filer-data:
