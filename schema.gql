  """
  是否需要雙因素認證
  """
  requiresTwoFactor: Boolean!

  """
  臨時 Token（用於完成 2FA 驗證）
  """
  temporaryToken: String!
}

"""
雙因素認證類型
"""
enum TwoFactorType {
  EMAIL
  SMS
  TOTP
}

