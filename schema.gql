  byScope: [ScopeStat!]!

  """
  最近活動
  """
  recentActivities: [RecentActivityType!]!

  """
  今日登入數
  """
  todayLogins: Int!

  """
  今日撤銷數
  """
  todayRevocations: Int!

  """
  前 5 活躍用戶
  """
  topActiveUsers: [UserActivityStat!]!

  """
  前 5 常用設備
  """
  topDevices: [DeviceStat!]!

  """
  已過期會話數
  """
  totalExpired: Int!

  """
  已撤銷會話數
  """
  totalRevoked: Int!

  """
  總會話數
  """
  totalSessions: Int!
}

"""
會話狀態（ACTIVE: 活躍, EXPIRED: 已過期, REVOKED: 已撤銷）
"""
enum SessionStatus {
  ACTIVE
  EXPIRED
  REVOKED
}

"""
會話詳細資訊
"""
type SessionType {
  """
  瀏覽器
  """
  browser: String

  """
  創建時間
  """
  createdAt: DateTime!

  """
  設備資訊
  """
  deviceInfo: String

  """
  過期時間
  """
  expiresAt: DateTime!

  """
  會話 ID
  """
  id: String!

  """
  IP 地址
  """
  ipAddress: String

  """
  是否活躍
  """
  isActive: Boolean!

  """
  是否為當前會話
  """
  isCurrent: Boolean

  """
  最後使用時間
  """
  lastUsedAt: DateTime!

  """
  地理位置
  """
  location: String

  """
  作業系統
  """
  os: String

  """
  撤銷時間
  """
  revokedAt: DateTime

  """
  撤銷者 ID
  """
  revokedBy: String

  """
  撤銷者名稱
  """
  revokedByName: String

  """
  撤銷方式
  """
  revokedMethod: RevokedMethod

  """
  撤銷原因
  """
  revokedReason: String

  """
  會話狀態
  """
  status: SessionStatus!

  """
  用戶電子郵件
  """
  userEmail: String

  """
  用戶 ID
  """
  userId: String!

  """
  用戶名稱
  """
  userName: String
}

type Subscription {
  """
  訂閱新稽核日誌（需要 HQ_SCOPE + audit-logs:read）
  """
  auditLogCreated: AuditLogType!

  """
  訂閱 Cron Job 配置更新（需要 HQ_SCOPE + cron_jobs:read）
  """
  cronJobConfigUpdated: CronJobConfigType!

  """
  訂閱新的 Cron Job 執行記錄（需要 HQ_SCOPE + cron_jobs:read）
  """
  cronJobExecutionCreated: CronJobExecutionType!

  """
  訂閱系統廣播通知
  """
  notificationBroadcast: NotificationGQLType!

  """
  訂閱新通知（即時推送）
  """
  notificationCreated: NotificationGQLType!

  """
  訂閱系統狀態變更（僅管理員）
  """
  systemStatusChanged(filter: ServiceFilterInput): SystemStatusGQLType!
}

"""
系統整體健康狀態
"""
type SystemHealthGQLType {
  """
  檢查時間
  """
  checkedAt: DateTime!

  """
  整體狀態
  """
  overallStatus: ServiceStatus!

  """
  各服務狀態
  """
  services: [SystemStatusGQLType!]!

  """
  系統運行時間（秒）
  """
  uptime: Float!
}

"""
系統服務狀態
"""
type SystemStatusGQLType {
  """
  額外資訊（如錯誤詳情）
  """
  details: String

  """
  狀態訊息
  """
  message: String!

  """
  回應時間（毫秒）
  """
  responseTime: Float

  """
  服務類型
  """
  service: ServiceType!

  """
  服務狀態
  """
  status: ServiceStatus!

  """
  時間戳記
  """
  timestamp: DateTime!
}

"""
手動觸發 Cron Job 的輸入
"""
input TriggerCronJobInput {
  """
  是否強制執行（跳過鎖檢查和 isEnabled 檢查）
  """
  force: Boolean = false

  """
  Job 名稱
  """
  jobName: String!
}

"""
手動觸發 Cron Job 的結果
"""
type TriggerCronJobResult {
  """
  執行記錄 ID
  """
  executionId: String

  """
  訊息
  """
  message: String

  """
  是否成功觸發
  """
  success: Boolean!
}

"""
雙因素認證設定資訊
"""
type TwoFactorAuthType {
  """
  建立時間
  """
  createdAt: DateTime!

  """
  是否已啟用
  """
  enabled: Boolean!

  """
  最後驗證時間
  """
  lastVerifiedAt: DateTime

  """
  雙因素認證類型
  """
  type: TwoFactorType!

  """
  更新時間
  """
  updatedAt: DateTime!
}

"""
需要雙因素認證的登入回應
"""
type TwoFactorLoginResponse {
  """
  提示訊息
  """
